<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D17" />
      <stop offset="50%" stop-color="#14182E" />
      <stop offset="100%" stop-color="#07080F" />
    </linearGradient>
    <linearGradient id="glowVioletCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#00F5FF" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern in background -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="320" x2="400" y2="320" />
  </g>

  <!-- Concentric Orbital Rings -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="rgba(139, 92, 246, 0.15)" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="200" cy="200" r="115" fill="none" stroke="url(#glowVioletCyan)" stroke-width="2" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="200" cy="200" r="80" fill="rgba(20, 24, 46, 0.85)" stroke="url(#cyanAccent)" stroke-width="2.5" />

  <!-- Constellation Accent Nodes -->
  <circle cx="200" cy="50" r="4.5" fill="#22D3EE" filter="url(#softGlow)" />
  <circle cx="340" cy="160" r="3.5" fill="#8B5CF6" />
  <circle cx="65" cy="240" r="3.5" fill="#EC4899" />
  <circle cx="290" cy="310" r="4" fill="#00F5FF" />
  <circle cx="110" cy="90" r="3" fill="#A855F7" />

  <!-- Central Monogram "AS" -->
  <g font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="central">
    <text x="200" y="202" font-size="74" fill="url(#glowVioletCyan)" letter-spacing="2" filter="url(#softGlow)">AS</text>
  </g>

  <!-- Developer / AI Badge Ribbon -->
  <g transform="translate(115, 305)">
    <rect width="170" height="32" rx="16" fill="rgba(11, 13, 23, 0.85)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" />
    <circle cx="20" cy="16" r="4" fill="#10B981" />
    <text x="95" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0" font-weight="600" text-anchor="middle" dominant-baseline="central">PYTHON · AI</text>
  </g>
</svg>
