<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1224" />
      <stop offset="100%" stop-color="#181B34" />
    </linearGradient>
    <linearGradient id="cfViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="cfCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="cfGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="360" rx="16" fill="url(#cfBg)" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1.5" />

  <!-- Code Workspace Window -->
  <g transform="translate(40, 35)">
    <!-- Window Header -->
    <rect width="320" height="290" rx="10" fill="#0A0C16" stroke="rgba(255,255,255,0.08)" />
    <rect width="320" height="32" rx="10" fill="rgba(255,255,255,0.03)" />
    <!-- Traffic lights -->
    <circle cx="20" cy="16" r="4.5" fill="#EF4444" />
    <circle cx="36" cy="16" r="4.5" fill="#F59E0B" />
    <circle cx="52" cy="16" r="4.5" fill="#10B981" />
    <text x="170" y="19" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" text-anchor="middle">challenge_runner.py</text>

    <!-- Code Editor Lines -->
    <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#E2E8F0">
      <text x="18" y="65" fill="#8B5CF6">class</text>
      <text x="60" y="65" fill="#22D3EE">DockerSandbox:</text>
      
      <text x="35" y="90" fill="#94A3B8">def __init__(self, challenge_id):</text>
      <text x="50" y="112" fill="#F43F5E">self.network</text>
      <text x="145" y="112" fill="#94A3B8">=</text>
      <text x="160" y="112" fill="#10B981">"none"</text>
      
      <text x="50" y="134" fill="#F43F5E">self.mem_limit</text>
      <text x="155" y="134" fill="#94A3B8">=</text>
      <text x="170" y="134" fill="#F59E0B">"256m"</text>

      <text x="35" y="165" fill="#8B5CF6">def</text>
      <text x="62" y="165" fill="#22D3EE">evaluate_solution</text>
      <text x="188" y="165" fill="#94A3B8">(self):</text>

      <text x="50" y="188" fill="#94A3B8">results = run_pytest_suite()</text>
      <text x="50" y="210" fill="#8B5CF6">return</text>
      <text x="100" y="210" fill="#10B981">{"score": 100, "status": "PASSED"}</text>
    </g>

    <!-- Embedded Terminal Output -->
    <rect x="18" y="232" width="284" height="42" rx="6" fill="#05070D" stroke="rgba(16, 185, 129, 0.3)" />
    <text x="30" y="258" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#10B981">
      ✔ 14/14 Unit &amp; Security Tests Passed
    </text>
  </g>

  <!-- Sandbox & Security Container Diagram (Right Side) -->
  <g transform="translate(385, 35)">
    <!-- Container Box -->
    <rect width="180" height="135" rx="10" fill="rgba(139, 92, 246, 0.08)" stroke="url(#cfViolet)" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="90" y="25" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#A855F7" text-anchor="middle">ISOLATED DOCKER</text>
    
    <!-- Security Badges inside sandbox -->
    <g transform="translate(20, 42)">
      <rect width="140" height="24" rx="4" fill="rgba(11, 13, 23, 0.9)" stroke="rgba(6, 182, 212, 0.4)" />
      <text x="70" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22D3EE" text-anchor="middle">🔒 Zero-Network Policy</text>
    </g>
    <g transform="translate(20, 72)">
      <rect width="140" height="24" rx="4" fill="rgba(11, 13, 23, 0.9)" stroke="rgba(236, 72, 153, 0.4)" />
      <text x="70" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F43F5E" text-anchor="middle">⚡ 256MB RAM Bound</text>
    </g>
    <g transform="translate(20, 102)">
      <rect width="140" height="24" rx="4" fill="rgba(11, 13, 23, 0.9)" stroke="rgba(16, 185, 129, 0.4)" />
      <text x="70" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981" text-anchor="middle">🛡 Path Traversal Guard</text>
    </g>

    <!-- Recruiter & Skill Metrics Panel -->
    <g transform="translate(0, 155)">
      <rect width="180" height="135" rx="10" fill="rgba(6, 182, 212, 0.06)" stroke="url(#cfCyan)" stroke-width="1.5" />
      <text x="90" y="24" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#22D3EE" text-anchor="middle">EVALUATION METRICS</text>
      
      <text x="20" y="52" font-family="'Outfit', sans-serif" font-size="11" fill="#94A3B8">Bug Fix Precision</text>
      <rect x="20" y="58" width="140" height="5" rx="2.5" fill="rgba(255,255,255,0.1)" />
      <rect x="20" y="58" width="130" height="5" rx="2.5" fill="#8B5CF6" />

      <text x="20" y="80" font-family="'Outfit', sans-serif" font-size="11" fill="#94A3B8">API Architecture</text>
      <rect x="20" y="86" width="140" height="5" rx="2.5" fill="rgba(255,255,255,0.1)" />
      <rect x="20" y="86" width="125" height="5" rx="2.5" fill="#06B6D4" />

      <text x="20" y="108" font-family="'Outfit', sans-serif" font-size="11" fill="#94A3B8">Security Verification</text>
      <rect x="20" y="114" width="140" height="5" rx="2.5" fill="rgba(255,255,255,0.1)" />
      <rect x="20" y="114" width="135" height="5" rx="2.5" fill="#10B981" />
    </g>
  </g>
</svg>
