<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="smBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1D" />
      <stop offset="100%" stop-color="#16122C" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="voiceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="smGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#smBg)" stroke="rgba(236, 72, 153, 0.25)" stroke-width="1.5" />

  <!-- Vision HUD / OpenCV Face Detection Canvas (Left) -->
  <g transform="translate(40, 35)">
    <rect width="280" height="290" rx="10" fill="#04060C" stroke="rgba(0, 245, 255, 0.3)" />
    
    <!-- Camera Viewfinder Corners -->
    <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#00F5FF" stroke-width="2.5" />
    <path d="M 265 35 L 265 15 L 245 15" fill="none" stroke="#00F5FF" stroke-width="2.5" />
    <path d="M 15 255 L 15 275 L 35 275" fill="none" stroke="#00F5FF" stroke-width="2.5" />
    <path d="M 265 255 L 265 275 L 245 275" fill="none" stroke="#00F5FF" stroke-width="2.5" />

    <!-- Camera HUD Info -->
    <text x="25" y="32" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F5FF">LIVE CAM [OPENCV FEED]</text>
    <circle cx="250" cy="28" r="4" fill="#EF4444" />
    <text x="238" y="31" font-family="'JetBrains Mono', monospace" font-size="9" fill="#EF4444" text-anchor="end">REC</text>

    <!-- Face Recognition Bounding Box -->
    <g transform="translate(60, 60)">
      <rect width="160" height="170" rx="8" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="8 4" />
      
      <!-- Target Bounding Box Label -->
      <rect x="0" y="-18" width="160" height="18" fill="#10B981" rx="3" />
      <text x="80" y="-5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#000" text-anchor="middle">
        STUDENT DETECTED (CONF: 98%)
      </text>

      <!-- Abstract Face Silhouette -->
      <circle cx="80" cy="70" r="38" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
      <!-- Eyes & Smile -->
      <circle cx="68" cy="62" r="3" fill="#00F5FF" />
      <circle cx="92" cy="62" r="3" fill="#00F5FF" />
      <path d="M 68 85 Q 80 98 92 85" fill="none" stroke="#00F5FF" stroke-width="2" />

      <!-- Emotion Detection Tag -->
      <rect x="20" y="130" width="120" height="24" rx="12" fill="rgba(139, 92, 246, 0.3)" stroke="#8B5CF6" />
      <text x="80" y="146" font-family="'Outfit', sans-serif" font-size="11" fill="#E2E8F0" text-anchor="middle">
        Emotion: Happy 😊
      </text>
    </g>

    <!-- Coordinates HUD -->
    <text x="25" y="265" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">
      POS: X=142 Y=88 | FPS: 30.2
    </text>
  </g>

  <!-- Right: Voice Interaction & Hardware Architecture -->
  <g transform="translate(345, 35)">
    <!-- Speech Synthesis / Voice Waveform Card -->
    <rect width="215" height="135" rx="10" fill="#0A0F24" stroke="rgba(236, 72, 153, 0.3)" />
    <text x="20" y="28" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#EC4899">SPEECH SYNTHESIS &amp; TTS</text>
    
    <!-- Voice Waveform bars -->
    <g transform="translate(20, 48)">
      <rect x="0" y="18" width="4" height="24" rx="2" fill="#EC4899" />
      <rect x="10" y="10" width="4" height="40" rx="2" fill="#D946EF" />
      <rect x="20" y="4" width="4" height="52" rx="2" fill="#A855F7" />
      <rect x="30" y="14" width="4" height="32" rx="2" fill="#8B5CF6" />
      <rect x="40" y="2" width="4" height="56" rx="2" fill="#6366F1" />
      <rect x="50" y="8" width="4" height="44" rx="2" fill="#3B82F6" />
      <rect x="60" y="18" width="4" height="24" rx="2" fill="#06B6D4" />
      <rect x="70" y="6" width="4" height="48" rx="2" fill="#00F5FF" />
      <rect x="80" y="16" width="4" height="28" rx="2" fill="#10B981" />
      <rect x="90" y="20" width="4" height="20" rx="2" fill="#A855F7" />
      <rect x="100" y="8" width="4" height="44" rx="2" fill="#EC4899" />
      <rect x="110" y="12" width="4" height="36" rx="2" fill="#06B6D4" />
      <rect x="120" y="18" width="4" height="24" rx="2" fill="#8B5CF6" />
      <rect x="130" y="22" width="4" height="16" rx="2" fill="#3B82F6" />
      <rect x="140" y="10" width="4" height="40" rx="2" fill="#10B981" />
      <rect x="150" y="18" width="4" height="24" rx="2" fill="#EC4899" />
      <rect x="160" y="24" width="4" height="12" rx="2" fill="#00F5FF" />
      <rect x="170" y="20" width="4" height="20" rx="2" fill="#8B5CF6" />
    </g>
    <text x="20" y="118" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">
      "Welcome to AI Department!"
    </text>

    <!-- Embedded Hardware & LLM Bridge Card -->
    <g transform="translate(0, 150)">
      <rect width="215" height="140" rx="10" fill="#0A0F24" stroke="rgba(139, 92, 246, 0.3)" />
      <text x="20" y="28" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#A855F7">RASPBERRY PI &amp; CHATGPT</text>

      <g transform="translate(20, 45)">
        <rect width="175" height="26" rx="5" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" />
        <text x="87" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399" text-anchor="middle">
          ⚡ ChatGPT Collegiate API
        </text>
      </g>

      <g transform="translate(20, 80)">
        <rect width="175" height="26" rx="5" fill="rgba(6, 182, 212, 0.15)" stroke="#06B6D4" />
        <text x="87" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#22D3EE" text-anchor="middle">
          🍓 Raspberry Pi 4 Device Loop
        </text>
      </g>
      
      <text x="107" y="125" font-family="'Outfit', sans-serif" font-size="10" fill="#64748B" text-anchor="middle">
        Low-Latency Audio/Video Pipeline
      </text>
    </g>
  </g>
</svg>
